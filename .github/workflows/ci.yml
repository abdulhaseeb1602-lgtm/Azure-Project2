
name: Azure Project 2 CI

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Application Files
        run: |
          test -f app/Dockerfile
          test -f app/index.html
          test -f app/deployment.yaml
          test -f app/service.yaml
          
          
      - name: Build Docker Image
        run: |
          docker build -t azure-project2:${{ github.sha }} ./app
          echo "Docker image built successfully"
          
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'azure-project2:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

          
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name haseebproject2acr

      - name: Tag and Push Docker Image to ACR
        run: |
          docker tag azure-project2:${{ github.sha }} haseebproject2acr.azurecr.io/azure-project2:${{ github.sha }}
          docker push haseebproject2acr.azurecr.io/azure-project2:${{ github.sha }}


      - name: Update Kubernetes manifest for Argo CD
        run: |
          sed -i "s|image: haseebproject2acr.azurecr.io/azure-project2:.*|image: haseebproject2acr.azurecr.io/azure-project2:${{ github.sha }}|" app/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/deployment.yaml
          git diff --cached --quiet || git commit -m "Update AKS image to ${{ github.sha }}"
          git push